spring.application.name=agentops-guardian

# Local config
spring.profiles.active=local

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agentops_guardian
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JDBC
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Actuator
management.endpoints.web.exposure.include=health,info

# Raw Data
app.dataset.path=./data
app.dataset.import=false

# Generated analytical report PDFs
agentops.reports.directory=${REPORTS_DIRECTORY:./data/reports}

# Gmail SMTP email delivery.
spring.mail.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_SMTP_PORT:587}
spring.mail.protocol=smtp
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=${GMAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties[mail.smtp.timeout]=${GMAIL_SMTP_READ_TIMEOUT:5000}
spring.mail.properties[mail.smtp.writetimeout]=${GMAIL_SMTP_WRITE_TIMEOUT:5000}
agentops.email.sender=${GMAIL_SENDER:}
agentops.email.allowed-recipients=${EMAIL_ALLOWED_RECIPIENTS:}

# Maximum recent user and assistant messages retained per conversation
agentops.conversation.max-messages=${CONVERSATION_MAX_MESSAGES:12}
agentops.governance.enabled=${GOVERNANCE_ENABLED:true}