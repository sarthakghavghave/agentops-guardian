spring.application.name=agentops-guardian

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agentops_guardian
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JDBC
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Actuator
management.endpoints.web.exposure.include=health,info

# Raw Data
app.dataset.path=./data
app.dataset.import=false